<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1db954;--green-dark:#158a3e;--green-light:#4ade80;
  --gold:#c9a84c;--gold-light:#f5d67a;
  --text:#0a1f0f;--muted:#4a7a5a;
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(29,185,84,0.60) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.45) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 10%, rgba(29,185,84,0.35) 0%, transparent 40%),
    radial-gradient(ellipse at 10% 85%, rgba(201,168,76,0.30) 0%, transparent 40%),
    #021a0a;
  font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;
  width:550px;height:550px;border-radius:50%;
  background:radial-gradient(circle,rgba(29,185,84,0.22) 0%,transparent 70%);
  top:-120px;right:-120px;pointer-events:none;z-index:0;
  animation:float1 9s ease-in-out infinite;
}
body::after{
  content:'';position:fixed;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0.18) 0%,transparent 70%);
  bottom:-80px;left:-80px;pointer-events:none;z-index:0;
  animation:float2 11s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-28px,28px) scale(1.08);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(28px,-20px) scale(1.07);}}

.container{position:relative;z-index:1;width:100%;max-width:440px;}

.logo{text-align:center;margin-bottom:36px;}
.logo-icon{font-size:42px;line-height:1;margin-bottom:8px;}
.logo-name{
  font-family:'Cinzel',serif;font-size:32px;font-weight:700;
  background:linear-gradient(135deg,var(--green-light),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:4px;
}
.logo-tagline{font-size:12px;color:var(--gold-light);letter-spacing:3px;margin-top:4px;text-transform:uppercase;opacity:0.85;}

.card{
  background:rgba(255,255,255,0.07);
  border-radius:28px;padding:40px 36px;
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:
    0 32px 64px rgba(0,0,0,0.45),
    0 8px 24px rgba(0,0,0,0.25),
    inset 0 1.5px 0 rgba(255,255,255,0.38),
    inset 0 -1px 0 rgba(255,255,255,0.05),
    inset 1px 0 0 rgba(255,255,255,0.10),
    inset -1px 0 0 rgba(255,255,255,0.10);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,0.07) 50%,transparent);
  transform:skewX(-15deg);pointer-events:none;
}

.tabs{
  display:flex;
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:14px;padding:4px;margin-bottom:32px;gap:4px;
  backdrop-filter:blur(10px);
}
.tab{
  flex:1;padding:10px;text-align:center;border-radius:11px;cursor:pointer;
  font-size:14px;font-weight:500;color:rgba(255,255,255,0.45);
  transition:all 0.3s;border:none;background:transparent;font-family:'Inter',sans-serif;
}
.tab.active{
  background:linear-gradient(135deg,var(--green-dark),var(--green),var(--gold));
  color:#fff;
  box-shadow:0 2px 16px rgba(29,185,84,0.40),inset 0 1px 0 rgba(255,255,255,0.20);
}

.form-section{display:none;}
.form-section.active{display:block;}
.form-group{margin-bottom:20px;}
label{
  display:block;font-size:12px;font-weight:500;
  color:rgba(245,214,122,0.90);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
}
input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:14px;color:#fff;font-size:14px;
  font-family:'Inter',sans-serif;outline:none;transition:all 0.3s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);
}
input:focus{
  border-color:rgba(29,185,84,0.60);
  background:rgba(255,255,255,0.12);
  box-shadow:0 0 0 3px rgba(29,185,84,0.15),inset 0 1px 0 rgba(255,255,255,0.15);
}
input::placeholder{color:rgba(255,255,255,0.28);}

.btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px;
  transition:all 0.3s;margin-top:8px;font-family:'Inter',sans-serif;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%);
  border-radius:14px;pointer-events:none;
}
.btn-primary{
  background:linear-gradient(135deg,var(--green-dark),var(--green),var(--gold));
  color:#fff;
  box-shadow:0 4px 20px rgba(29,185,84,0.40),inset 0 1px 0 rgba(255,255,255,0.20);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(29,185,84,0.50),inset 0 1px 0 rgba(255,255,255,0.20);}
.btn-primary:active{transform:translateY(0);}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.12);}
.divider span{font-size:12px;color:rgba(255,255,255,0.35);}

.admin-link{text-align:center;margin-top:24px;font-size:13px;color:rgba(255,255,255,0.40);}
.admin-link a{color:var(--gold);text-decoration:none;font-weight:500;}
.admin-link a:hover{color:var(--gold-light);}

.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;backdrop-filter:blur(8px);}
.alert-error{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.30);color:#ff8a80;}
.alert-success{background:rgba(29,185,84,0.15);border:1px solid rgba(29,185,84,0.30);color:var(--green-light);}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">👑</div>
    <div class="logo-name">REXMART</div>
    <div class="logo-tagline">Shop Like a King</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="login">
      <div class="alert alert-error" id="login-error"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="register">
      <div class="alert alert-error" id="register-error"></div>
      <div class="alert alert-success" id="register-success"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')"/>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="reg-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="reg-phone" placeholder="9999999999" oninput="this.value = this.value.replace(/[^0-9]/g, '')"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>
    </div>

    <div class="divider"><span>or</span></div>
    <div class="admin-link">
      Are you an admin? <a href="admin-login.html">Admin Login →</a>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8080/api';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
  document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  
  if (!email || !password) { showError(err, 'Please enter both email and password.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError(err, 'Please enter a valid email address.'); return; }
  
  try {
    const authRes = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!authRes.ok) throw new Error('Invalid email or password.');
    const authData = await authRes.json();
    
    localStorage.setItem('jwtToken', authData.token);
    
    const customerRes = await fetch(`${API}/customers/email/${email}`, {
      headers: { 'Authorization': 'Bearer ' + authData.token }
    });
    if (!customerRes.ok) throw new Error('Customer profile not found.');
    const customer = await customerRes.json();
    
    localStorage.setItem('customerId', customer.id);
    localStorage.setItem('customerName', customer.name);
    window.location.href = 'customer-home.html';
  } catch(e) { showError(err, e.message); }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  const err = document.getElementById('register-error');
  const succ = document.getElementById('register-success');
  err.style.display = 'none'; succ.style.display = 'none';
  
  if (!name || !email || !phone || !password) { showError(err, 'Please fill all fields.'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError(err, 'Please enter a valid email address.'); return; }
  if (!/^[a-zA-Z\s]+$/.test(name)) { showError(err, 'Name must contain only letters and spaces.'); return; }
  if (!/^\d+$/.test(phone)) { showError(err, 'Phone number must contain only numbers.'); return; }
  if (!/^[a-zA-Z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?\s]+$/.test(password)) { 
    showError(err, 'Password can only contain letters, numbers, and symbols.'); 
    return; 
  }
  if (password.length < 6) { showError(err, 'Password must be at least 6 characters long.'); return; }
  
  try {
    // 1. Create the customer profile
    const customerRes = await fetch(`${API}/customers`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone })
    });
    if (!customerRes.ok) throw new Error('Profile registration failed.');
    
    // 2. Create the user authentication account
    const authRes = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!authRes.ok) throw new Error('Authentication account creation failed.');
    
    succ.textContent = '✅ Account created! Please sign in.';
    succ.style.display = 'block';
    setTimeout(() => switchTab('login'), 1500);
  } catch(e) { showError(err, e.message); }
}

function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
