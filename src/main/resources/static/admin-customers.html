<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – Customers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#c0392b;--red-dark:#922b21;--red-light:#e74c3c;--gold:#c9a84c;--gold-light:#f5d67a;--surface:#f9f5f0;--surface2:#f0e8db;--glass:rgba(201,168,76,0.06);--glass-border:rgba(192,57,43,0.18);--text:#1a0a00;--muted:#7a5c4a;}
body{
  background:#fff;
  background-image:radial-gradient(rgba(192,57,43,0.05) 1px,transparent 1px);
  background-size:30px 30px;
  font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;
}
.sidebar{width:220px;min-height:100vh;background:linear-gradient(180deg,#1a0200 0%,#2d0808 60%,#1a0200 100%);border-right:1px solid rgba(201,168,76,0.25);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;box-shadow:4px 0 24px rgba(192,57,43,0.12);}
.sidebar-logo{padding:28px 20px 20px;border-bottom:1px solid rgba(201,168,76,0.2);}
.logo-name{font-family:'Cinzel',serif;font-size:20px;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px;}
.logo-badge{font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;opacity:0.7;margin-top:4px;}
.sidebar-nav{flex:1;padding:16px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:all 0.2s;color:rgba(245,214,122,0.55);font-size:14px;font-weight:500;text-decoration:none;margin-bottom:4px;}
.nav-item:hover{background:rgba(201,168,76,0.08);color:var(--gold-light);}
.nav-item.active{background:rgba(192,57,43,0.28);color:var(--gold);border:1px solid rgba(192,57,43,0.45);}
.nav-item-icon{font-size:18px;width:22px;text-align:center;}
.sidebar-footer{padding:16px;border-top:1px solid rgba(201,168,76,0.15);}
.btn-logout{width:100%;padding:10px;border:1px solid rgba(192,57,43,0.4);border-radius:10px;background:transparent;color:rgba(231,76,60,0.85);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:all 0.2s;}
.btn-logout:hover{border-color:var(--red-light);color:var(--red-light);background:rgba(192,57,43,0.08);}
.main{margin-left:220px;flex:1;padding:32px;}
.page-title{font-family:'Cinzel',serif;font-size:26px;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px;}
.table-wrap{background:#fff;border:1px solid var(--glass-border);border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(192,57,43,0.07);}
.search-bar{padding:16px 20px;border-bottom:1px solid var(--glass-border);background:var(--surface);}
.search-bar input{width:100%;max-width:320px;padding:9px 14px;background:#fff;border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
.search-bar input:focus{border-color:var(--gold);}
.search-bar input::placeholder{color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid var(--glass-border);background:var(--surface);}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid rgba(192,57,43,0.06);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(201,168,76,0.04);}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red-dark),var(--red-light));display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
.btn-del{padding:6px 14px;border:1px solid rgba(192,57,43,0.35);border-radius:8px;background:transparent;color:rgba(192,57,43,0.85);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.btn-del:hover{background:rgba(192,57,43,0.08);border-color:var(--red);}
.toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--gold);color:var(--text);padding:14px 20px;border-radius:12px;font-size:14px;z-index:999;transform:translateY(80px);opacity:0;transition:all 0.3s;box-shadow:0 4px 20px rgba(201,168,76,0.18);}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><div class="logo-name">👑 REXMART</div><div class="logo-badge">Admin Portal</div></div>
  <div class="sidebar-nav">
    <a href="admin-dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span>Dashboard</a>
    <a href="admin-products.html" class="nav-item"><span class="nav-item-icon">🛍️</span>Products</a>
    <a href="admin-orders.html" class="nav-item"><span class="nav-item-icon">📦</span>Orders</a>
    <a href="admin-customers.html" class="nav-item active"><span class="nav-item-icon">👥</span>Customers</a>
    <a href="admin-reviews.html" class="nav-item"><span class="nav-item-icon">⭐</span>Reviews</a>
  </div>
  <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
</div>

<div class="main">
  <div class="page-title">👥 Customers</div>
  <div class="table-wrap">
    <div class="search-bar"><input type="text" placeholder="Search customers..." oninput="filter(this.value)"/></div>
    <table>
      <thead><tr><th></th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Action</th></tr></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API='http://localhost:8080/api';
if(!localStorage.getItem('adminId')){window.location.href='admin-login.html';}
let all=[];

async function load(){
  const res=await fetch(`${API}/customers`);
  all=await res.json();render(all);
}

function render(data){
  document.getElementById('table').innerHTML=data.map(c=>`
    <tr>
      <td><div class="avatar">${c.name?c.name[0].toUpperCase():'?'}</div></td>
      <td><b>${c.name}</b></td>
      <td style="color:var(--muted)">${c.email}</td>
      <td style="color:var(--muted)">${c.phone||'—'}</td>
      <td style="color:var(--muted)">${new Date(c.createdAt).toLocaleDateString()}</td>
      <td><button class="btn-del" onclick="del(${c.id})">Delete</button></td>
    </tr>
  `).join('');
}

function filter(q){render(all.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.email.toLowerCase().includes(q.toLowerCase())));}

async function del(id){
  if(!confirm('Delete this customer?'))return;
  try{await fetch(`${API}/customers/${id}`,{method:'DELETE'});load();showToast('Customer deleted');}
  catch{showToast('❌ Failed');}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function logout(){localStorage.clear();window.location.href='admin-login.html';}
load();
</script>
</body>
</html>
