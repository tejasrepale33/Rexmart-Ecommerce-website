<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – Manage Products</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#c0392b;--red-dark:#922b21;--red-light:#e74c3c;--gold:#c9a84c;--gold-light:#f5d67a;--surface:#f9f5f0;--surface2:#f0e8db;--glass:rgba(201,168,76,0.06);--glass-border:rgba(192,57,43,0.18);--text:#1a0a00;--muted:#7a5c4a;}
body{background:#fff;background-image:radial-gradient(rgba(192,57,43,0.05) 1px,transparent 1px);background-size:30px 30px;font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:linear-gradient(180deg,#1a0200 0%,#2d0808 60%,#1a0200 100%);border-right:1px solid rgba(201,168,76,0.25);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;box-shadow:4px 0 24px rgba(192,57,43,0.12);}
.sidebar-logo{padding:28px 20px 20px;border-bottom:1px solid rgba(201,168,76,0.2);}
.logo-name{font-family:'Cinzel',serif;font-size:20px;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px;}
.logo-badge{font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;opacity:0.7;margin-top:4px;}
.sidebar-nav{flex:1;padding:16px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:all 0.2s;color:rgba(245,214,122,0.55);font-size:14px;font-weight:500;text-decoration:none;margin-bottom:4px;}
.nav-item:hover{background:rgba(201,168,76,0.08);color:var(--gold-light);}
.nav-item.active{background:rgba(192,57,43,0.28);color:var(--gold);border:1px solid rgba(192,57,43,0.45);}
.nav-item-icon{font-size:18px;width:22px;text-align:center;}
.sidebar-footer{padding:16px;border-top:1px solid rgba(201,168,76,0.15);}
.btn-logout{width:100%;padding:10px;border:1px solid rgba(192,57,43,0.4);border-radius:10px;background:transparent;color:rgba(231,76,60,0.85);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:all 0.2s;}
.btn-logout:hover{border-color:var(--red-light);color:var(--red-light);background:rgba(192,57,43,0.08);}

/* MAIN */
.main{margin-left:220px;flex:1;padding:32px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.page-title{font-family:'Cinzel',serif;font-size:26px;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.btn-add{padding:11px 22px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--red-dark),var(--red),var(--gold));color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;box-shadow:0 4px 16px rgba(192,57,43,0.25);}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,57,43,0.35);}

/* TABLE */
.table-wrap{background:#fff;border:1px solid var(--glass-border);border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(192,57,43,0.07);}
.search-bar{padding:16px 20px;border-bottom:1px solid var(--glass-border);background:var(--surface);}
.search-bar input{width:100%;max-width:320px;padding:9px 14px;background:#fff;border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
.search-bar input:focus{border-color:var(--gold);}
.search-bar input::placeholder{color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid var(--glass-border);background:var(--surface);}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid rgba(192,57,43,0.06);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(201,168,76,0.04);}
.product-img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface2);}
.product-img-placeholder{width:44px;height:44px;border-radius:8px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:20px;}

/* BADGES */
.stock-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.in-stock{background:rgba(46,125,50,0.12);color:#2e7d32;}
.out-stock{background:rgba(192,57,43,0.10);color:var(--red);}

/* ACTION BUTTONS */
.action-btns{display:flex;gap:8px;}
.btn-edit{padding:6px 14px;border:1px solid rgba(201,168,76,0.35);border-radius:8px;background:transparent;color:var(--gold);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;}
.btn-edit:hover{background:rgba(201,168,76,0.10);border-color:var(--gold);}
.btn-del{padding:6px 14px;border:1px solid rgba(192,57,43,0.35);border-radius:8px;background:transparent;color:rgba(192,57,43,0.85);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;}
.btn-del:hover{background:rgba(192,57,43,0.08);border-color:var(--red);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,2,0,0.55);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border:1px solid var(--glass-border);border-radius:22px;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(192,57,43,0.15);}
.modal-title{font-family:'Cinzel',serif;font-size:20px;background:linear-gradient(135deg,var(--red),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:500;color:var(--red);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
input,select{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border 0.2s;}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.10);}
input::placeholder{color:var(--muted);}
select option{background:#fff;color:var(--text);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:1;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--red-dark),var(--red),var(--gold));color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 16px rgba(192,57,43,0.25);transition:all 0.2s;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,57,43,0.35);}
.btn-cancel{flex:1;padding:12px;border:1px solid var(--glass-border);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.btn-cancel:hover{border-color:var(--red);color:var(--red);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--gold);color:var(--text);padding:14px 20px;border-radius:12px;font-size:14px;z-index:999;transform:translateY(80px);opacity:0;transition:all 0.3s;box-shadow:0 4px 20px rgba(201,168,76,0.18);}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><div class="logo-name">👑 REXMART</div><div class="logo-badge">Admin Portal</div></div>
  <div class="sidebar-nav">
    <a href="admin-dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span>Dashboard</a>
    <a href="admin-products.html" class="nav-item active"><span class="nav-item-icon">🛍️</span>Products</a>
    <a href="admin-orders.html" class="nav-item"><span class="nav-item-icon">📦</span>Orders</a>
    <a href="admin-customers.html" class="nav-item"><span class="nav-item-icon">👥</span>Customers</a>
    <a href="admin-reviews.html" class="nav-item"><span class="nav-item-icon">⭐</span>Reviews</a>
  </div>
  <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
</div>

<div class="main">
  <div class="top-bar">
    <div class="page-title">🛍️ Products</div>
    <button class="btn-add" onclick="openModal()">+ Add Product</button>
  </div>
  <div class="table-wrap">
    <div class="search-bar"><input type="text" placeholder="Search products..." oninput="filterProducts(this.value)"/></div>
    <table>
      <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
      <tbody id="product-table"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Product</div>
    <input type="hidden" id="edit-id"/>
    <div class="form-group"><label>Product Name</label><input id="f-name" placeholder="e.g. iPhone 15 Pro"/></div>
    <div class="form-row">
      <div class="form-group"><label>Price (₹)</label><input id="f-price" type="number" placeholder="999"/></div>
      <div class="form-group"><label>Stock</label><input id="f-stock" type="number" placeholder="50"/></div>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="f-category">
        <option value="">Select category</option>
        <option>Electronics</option><option>Clothing</option><option>Food</option><option>Books</option><option>Home</option><option>Sports</option><option>Beauty</option><option>Other</option>
      </select>
    </div>
    <div class="form-group"><label>Image URL</label><input id="f-image" placeholder="https://images.unsplash.com/..."/></div>
    <div class="form-group"><label>Description</label><input id="f-desc" placeholder="Short product description"/></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8080/api';
// Global fetch interceptor to append JWT Bearer token
(function() {
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    const token = localStorage.getItem('jwtToken');
    if (token && !url.includes('/api/auth/login') && !url.includes('/api/auth/register')) {
      options.headers['Authorization'] = 'Bearer ' + token;
    }
    return originalFetch(url, options);
  };
})();
if(!localStorage.getItem('adminId')){window.location.href='admin-login.html';}
let allProducts=[];

async function loadProducts(){
  const res=await fetch(`${API}/products`);
  allProducts=await res.json();
  renderTable(allProducts);
}

function renderTable(products){
  document.getElementById('product-table').innerHTML=products.map(p=>`
    <tr>
      <td>${p.imageUrl?`<img class="product-img" src="${p.imageUrl}" onerror="this.style.display='none'">`:`<div class="product-img-placeholder">🛍️</div>`}</td>
      <td><b>${p.name}</b>${p.description?`<div style="color:var(--muted);font-size:11px;margin-top:2px">${p.description.substring(0,40)}...</div>`:''}</td>
      <td style="color:var(--muted)">${p.category||'—'}</td>
      <td style="color:var(--gold);font-weight:600">₹${p.price.toFixed(2)}</td>
      <td><span class="stock-badge ${p.stock>0?'in-stock':'out-stock'}">${p.stock>0?p.stock+' left':'Out of Stock'}</span></td>
      <td><div class="action-btns">
        <button class="btn-edit" onclick='openEdit(${JSON.stringify(p)})'>Edit</button>
        <button class="btn-del" onclick="deleteProduct(${p.id})">Delete</button>
      </div></td>
    </tr>
  `).join('');
}

function filterProducts(q){renderTable(allProducts.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())));}

function openModal(){
  document.getElementById('modal-title').textContent='Add Product';
  document.getElementById('edit-id').value='';
  ['f-name','f-price','f-stock','f-image','f-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-category').value='';
  document.getElementById('modal').classList.add('show');
}

function openEdit(p){
  document.getElementById('modal-title').textContent='Edit Product';
  document.getElementById('edit-id').value=p.id;
  document.getElementById('f-name').value=p.name;
  document.getElementById('f-price').value=p.price;
  document.getElementById('f-stock').value=p.stock;
  document.getElementById('f-category').value=p.category||'';
  document.getElementById('f-image').value=p.imageUrl||'';
  document.getElementById('f-desc').value=p.description||'';
  document.getElementById('modal').classList.add('show');
}

function closeModal(){document.getElementById('modal').classList.remove('show');}

async function saveProduct(){
  const id=document.getElementById('edit-id').value;
  const body={
    name:document.getElementById('f-name').value,
    price:parseFloat(document.getElementById('f-price').value),
    stock:parseInt(document.getElementById('f-stock').value),
    category:document.getElementById('f-category').value,
    imageUrl:document.getElementById('f-image').value,
    description:document.getElementById('f-desc').value
  };
  try{
    const url=id?`${API}/products/${id}`:`${API}/products`;
    const method=id?'PUT':'POST';
    const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok)throw new Error();
    closeModal();loadProducts();showToast(id?'✅ Product updated!':'✅ Product added!');
  }catch{showToast('❌ Failed to save');}
}

async function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  try{
    await fetch(`${API}/products/${id}`,{method:'DELETE'});
    loadProducts();showToast('Product deleted');
  }catch{showToast('❌ Failed');}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function logout(){localStorage.clear();window.location.href='admin-login.html';}
loadProducts();
</script>
</body>
</html>
