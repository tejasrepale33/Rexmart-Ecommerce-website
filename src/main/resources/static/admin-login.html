<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#c0392b;--red-dark:#922b21;--red-light:#e74c3c;
  --gold:#c9a84c;--gold-light:#f5d67a;
  --text:#1a0a00;--muted:#7a5c4a;
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(192,57,43,0.55) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.45) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 10%, rgba(192,57,43,0.35) 0%, transparent 40%),
    radial-gradient(ellipse at 10% 80%, rgba(201,168,76,0.30) 0%, transparent 40%),
    #1a0200;
  font-family:'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow:hidden;
}

/* floating blobs for depth */
body::before{
  content:'';position:fixed;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(192,57,43,0.25) 0%, transparent 70%);
  top:-100px;right:-100px;
  pointer-events:none;z-index:0;
  animation:float1 8s ease-in-out infinite;
}
body::after{
  content:'';position:fixed;
  width:400px;height:400px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(201,168,76,0.20) 0%, transparent 70%);
  bottom:-80px;left:-80px;
  pointer-events:none;z-index:0;
  animation:float2 10s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,30px) scale(1.1);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-20px) scale(1.08);}}

.container{position:relative;z-index:1;width:100%;max-width:420px;}

.logo{text-align:center;margin-bottom:36px;}
.logo-icon{font-size:42px;line-height:1;margin-bottom:8px;}
.logo-name{
  font-family:'Cinzel',serif;font-size:32px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:4px;
}
.logo-badge{
  display:inline-block;margin-top:8px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(201,168,76,0.35);
  color:var(--gold);font-size:11px;letter-spacing:3px;
  text-transform:uppercase;padding:4px 16px;border-radius:20px;
  backdrop-filter:blur(8px);
}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,0.08);
  border-radius:28px;
  padding:40px 36px;
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,0.20);
  box-shadow:
    0 32px 64px rgba(0,0,0,0.40),
    0 8px 24px rgba(0,0,0,0.20),
    inset 0 1.5px 0 rgba(255,255,255,0.35),
    inset 0 -1px 0 rgba(255,255,255,0.05),
    inset 1px 0 0 rgba(255,255,255,0.10),
    inset -1px 0 0 rgba(255,255,255,0.10);
  position:relative;overflow:hidden;
}
/* glass shine sweep */
.card::before{
  content:'';position:absolute;
  top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,0.08) 50%,transparent);
  transform:skewX(-15deg);
  pointer-events:none;
}

.card-title{
  font-family:'Cinzel',serif;font-size:18px;
  background:linear-gradient(135deg,#fff,var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;margin-bottom:28px;letter-spacing:2px;
}

.form-group{margin-bottom:20px;}
label{
  display:block;font-size:12px;font-weight:500;
  color:rgba(245,214,122,0.85);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
}
input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;
  color:#fff;font-size:14px;font-family:'Inter',sans-serif;
  outline:none;transition:all 0.3s;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
}
input:focus{
  border-color:rgba(201,168,76,0.55);
  background:rgba(255,255,255,0.12);
  box-shadow:0 0 0 3px rgba(201,168,76,0.12),inset 0 1px 0 rgba(255,255,255,0.15);
}
input::placeholder{color:rgba(255,255,255,0.30);}

.btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px;
  transition:all 0.3s;margin-top:8px;font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,var(--red-dark),var(--red),var(--gold));
  color:#fff;
  box-shadow:
    0 4px 20px rgba(192,57,43,0.40),
    inset 0 1px 0 rgba(255,255,255,0.25);
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 60%);
  border-radius:14px;pointer-events:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(192,57,43,0.50),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn:active{transform:translateY(0);}

.back-link{text-align:center;margin-top:24px;font-size:13px;color:rgba(255,255,255,0.45);}
.back-link a{color:var(--gold);text-decoration:none;font-weight:500;}
.back-link a:hover{color:var(--gold-light);}

.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;}
.alert-error{
  background:rgba(192,57,43,0.15);
  border:1px solid rgba(192,57,43,0.30);
  color:#ff8a80;
  backdrop-filter:blur(8px);
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">👑</div>
    <div class="logo-name">REXMART</div>
    <div class="logo-badge">Admin Portal</div>
  </div>
  <div class="card">
    <div class="card-title">Administrator Access</div>
    <div class="alert alert-error" id="err"></div>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="email" placeholder="admin@rexmart.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleLogin()"/>
    </div>
    <button class="btn" onclick="handleLogin()">Access Dashboard</button>
    <div class="back-link" style="margin-top:20px;">
      Not an admin? <a href="customer-login.html">Customer Login →</a>
    </div>
  </div>
</div>
<script>
const API='http://localhost:8080/api';
async function handleLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  const err=document.getElementById('err');
  err.style.display='none';
  if(!email||!password){err.textContent='Please fill all fields.';err.style.display='block';return;}
  try{
    const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    if(!res.ok)throw new Error('Invalid credentials');
    const authData=await res.json();
    if(authData.role!=='ADMIN'){err.textContent='Access denied. Admins only.';err.style.display='block';return;}
    localStorage.setItem('jwtToken',authData.token);
    localStorage.setItem('adminId',authData.userId);
    localStorage.setItem('adminEmail',authData.email);
    window.location.href='admin-dashboard.html';
  }catch(e){err.textContent=e.message;err.style.display='block';}
}
</script>
</body>
</html>
