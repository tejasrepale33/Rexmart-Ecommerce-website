<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – Wishlist</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1db954;--green-dark:#158a3e;--green-light:#4ade80;
  --gold:#c9a84c;--gold-light:#f5d67a;
  --surface:#f7fdf9;--surface2:#edf7f1;
  --glass-border:rgba(29,185,84,0.18);
  --text:#0a1f0f;--muted:#4a7a5a;
}
body{
  background:
    radial-gradient(ellipse at 20% 30%, rgba(29,185,84,0.20) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(201,168,76,0.18) 0%, transparent 50%),
    #f0fdf4;
  background-attachment:fixed;
  font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;
}
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--glass-border);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;
  box-shadow:0 2px 16px rgba(29,185,84,0.08),inset 0 1px 0 rgba(255,255,255,0.90);
}
.nav-logo{
  font-family:'Cinzel',serif;font-size:22px;
  background:linear-gradient(135deg,var(--green-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:3px;text-decoration:none;
}
.nav-links{display:flex;gap:8px;}
.nav-btn{
  padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;text-decoration:none;
  border:1px solid rgba(29,185,84,0.20);
  background:rgba(255,255,255,0.50);
  color:var(--muted);font-family:'Inter',sans-serif;
  backdrop-filter:blur(10px);
}
.nav-btn:hover{color:var(--text);border-color:var(--green);}
.nav-btn-green{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px rgba(29,185,84,0.25);
}
.page{max-width:960px;margin:0 auto;padding:40px 24px;}
.page-title{
  font-family:'Cinzel',serif;font-size:28px;
  background:linear-gradient(135deg,var(--green-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:28px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
.card{
  background:rgba(255,255,255,0.50);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:18px;overflow:hidden;transition:all 0.3s;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 4px 20px rgba(29,185,84,0.08),inset 0 1.5px 0 rgba(255,255,255,0.85);
  position:relative;
}
.card::before{
  content:'';position:absolute;
  top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,0.25) 50%,transparent);
  transform:skewX(-15deg);pointer-events:none;z-index:1;
}
.card:hover{transform:translateY(-4px);border-color:rgba(201,168,76,0.40);box-shadow:0 12px 32px rgba(29,185,84,0.15);}
.card-img{width:100%;height:170px;object-fit:cover;background:var(--surface2);}
.card-img-placeholder{
  width:100%;height:170px;
  background:linear-gradient(135deg,rgba(29,185,84,0.10),rgba(201,168,76,0.10));
  display:flex;align-items:center;justify-content:center;font-size:44px;
}
.card-body{padding:14px;position:relative;z-index:2;}
.card-cat{font-size:11px;color:var(--green-dark);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-weight:600;}
.card-name{font-size:14px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.card-price{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:12px;}
.card-actions{display:flex;gap:8px;}
.btn-cart{
  flex:1;padding:9px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;
  font-family:'Inter',sans-serif;
  box-shadow:0 2px 8px rgba(29,185,84,0.20);
}
.btn-cart:hover{box-shadow:0 4px 14px rgba(29,185,84,0.35);}
.btn-remove{
  width:38px;height:38px;
  border:1px solid rgba(220,50,50,0.25);
  border-radius:10px;background:rgba(255,255,255,0.60);
  color:rgba(220,50,50,0.65);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.btn-remove:hover{border-color:#e74c3c;color:#e74c3c;}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-icon{font-size:56px;margin-bottom:16px;}
.btn-shop{
  display:inline-block;padding:12px 28px;
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;border-radius:12px;text-decoration:none;font-weight:600;margin-top:16px;
}
.toast{
  position:fixed;bottom:24px;right:24px;
  background:rgba(255,255,255,0.85);
  border:1px solid var(--green);color:var(--text);
  padding:14px 20px;border-radius:12px;font-size:14px;z-index:999;
  transform:translateY(80px);opacity:0;transition:all 0.3s;
  box-shadow:0 4px 20px rgba(29,185,84,0.15);backdrop-filter:blur(12px);
}
.toast.show{transform:translateY(0);opacity:1;}</style>
</head>
<body>
<nav>
  <a href="customer-home.html" class="nav-logo">👑 REXMART</a>
  <div class="nav-links">
    <a href="customer-home.html" class="nav-btn">← Shop</a>
    <a href="customer-cart.html" class="nav-btn nav-btn-green">🛒 Cart</a>
    <a href="customer-orders.html" class="nav-btn">My Orders</a>
    <button class="nav-btn" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="page">
  <div class="page-title">❤️ My Wishlist</div>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = 'http://localhost:8080/api';
// Global fetch interceptor to append JWT Bearer token
(function() {
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    const token = localStorage.getItem('jwtToken');
    if (token && !url.includes('/api/auth/login') && !url.includes('/api/auth/register')) {
      options.headers['Authorization'] = 'Bearer ' + token;
    }
    return originalFetch(url, options);
  };
})();
const customerId=localStorage.getItem('customerId');
if(!customerId){window.location.href='customer-login.html';}
let wishlist=null;

async function loadWishlist(){
  try{
    const res=await fetch(`${API}/wishlist/customer/${customerId}`);
    if(!res.ok)throw new Error();
    wishlist=await res.json();
    render();
  }catch{
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">❤️</div><p>Your wishlist is empty</p><a href="customer-home.html" class="btn-shop">Start Shopping</a></div>';
  }
}

function render(){
  const products=wishlist.products||[];
  if(!products.length){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">❤️</div><p>Your wishlist is empty</p><a href="customer-home.html" class="btn-shop">Start Shopping</a></div>';
    return;
  }
  document.getElementById('content').innerHTML=`<div class="grid">${products.map(p=>`
    <div class="card">
      ${p.imageUrl?`<img class="card-img" src="${p.imageUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="card-img-placeholder" style="display:none">🛍️</div>`:`<div class="card-img-placeholder">🛍️</div>`}
      <div class="card-body">
        <div class="card-cat">${p.category||'General'}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">₹${p.price.toFixed(2)}</div>
        <div class="card-actions">
          <button class="btn-cart" onclick="addToCart(${p.id})">Add to Cart</button>
          <button class="btn-remove" onclick="removeFromWishlist(${p.id})">🗑️</button>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}

async function addToCart(productId){
  try{
    await fetch(`${API}/cart/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:parseInt(customerId),productId,quantity:1})});
    showToast('✅ Added to cart!');
  }catch{showToast('❌ Failed');}
}

async function removeFromWishlist(productId){
  try{
    const res=await fetch(`${API}/wishlist/remove`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:parseInt(customerId),productId})});
    wishlist=await res.json();render();showToast('Removed from wishlist');
  }catch{showToast('❌ Failed');}
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function logout(){localStorage.clear();window.location.href='customer-login.html';}
loadWishlist();
</script>
</body>
</html>
