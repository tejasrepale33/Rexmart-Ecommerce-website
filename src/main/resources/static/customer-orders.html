<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rexmart – My Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1db954;--green-dark:#158a3e;--green-light:#4ade80;
  --gold:#c9a84c;--gold-light:#f5d67a;
  --surface:#f7fdf9;--surface2:#edf7f1;
  --glass-border:rgba(29,185,84,0.18);
  --text:#0a1f0f;--muted:#4a7a5a;
}
body{
  background:
    radial-gradient(ellipse at 20% 30%, rgba(29,185,84,0.20) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(201,168,76,0.18) 0%, transparent 50%),
    #f0fdf4;
  background-attachment:fixed;
  font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;
}
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--glass-border);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;
  box-shadow:0 2px 16px rgba(29,185,84,0.08),inset 0 1px 0 rgba(255,255,255,0.90);
}
.nav-logo{
  font-family:'Cinzel',serif;font-size:22px;
  background:linear-gradient(135deg,var(--green-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:3px;text-decoration:none;
}
.nav-links{display:flex;gap:8px;}
.nav-btn{
  padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;text-decoration:none;
  border:1px solid rgba(29,185,84,0.20);
  background:rgba(255,255,255,0.50);
  color:var(--muted);font-family:'Inter',sans-serif;
  backdrop-filter:blur(10px);
}
.nav-btn:hover{color:var(--text);border-color:var(--green);}
.nav-btn-green{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px rgba(29,185,84,0.25);
}
.page{max-width:820px;margin:0 auto;padding:40px 24px;}
.page-title{
  font-family:'Cinzel',serif;font-size:28px;
  background:linear-gradient(135deg,var(--green-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:28px;
}
.order-card{
  background:rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:18px;padding:22px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 4px 20px rgba(29,185,84,0.08),inset 0 1.5px 0 rgba(255,255,255,0.85);
  transition:all 0.2s;
}
.order-card:hover{border-color:rgba(29,185,84,0.30);box-shadow:0 8px 28px rgba(29,185,84,0.12);}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.order-id{font-size:13px;color:var(--muted);}
.order-date{font-size:13px;color:var(--muted);margin-top:4px;}
.status-badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:0.5px;}
.status-PENDING{background:rgba(255,193,7,0.15);color:#b8860b;border:1px solid rgba(255,193,7,0.30);}
.status-CONFIRMED{background:rgba(29,185,84,0.15);color:var(--green-dark);border:1px solid rgba(29,185,84,0.30);}
.status-SHIPPED{background:rgba(33,150,243,0.15);color:#1565c0;border:1px solid rgba(33,150,243,0.30);}
.status-DELIVERED{background:rgba(29,185,84,0.20);color:#2e7d32;border:1px solid rgba(46,125,50,0.30);}
.status-CANCELLED{background:rgba(220,50,50,0.12);color:#c0392b;border:1px solid rgba(220,50,50,0.25);}
.order-products{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.product-chip{
  background:rgba(255,255,255,0.60);
  border:1px solid rgba(29,185,84,0.15);
  border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);
}
.order-footer{
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid rgba(29,185,84,0.12);padding-top:14px;
}
.order-total{font-size:18px;font-weight:700;color:var(--gold);}
.order-qty{font-size:13px;color:var(--muted);}
.timeline{display:flex;gap:0;margin-bottom:16px;}
.step{flex:1;text-align:center;position:relative;}
.step::before{content:'';position:absolute;top:10px;left:50%;right:-50%;height:2px;background:rgba(29,185,84,0.15);z-index:0;}
.step:last-child::before{display:none;}
.step-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;border:2px solid rgba(29,185,84,0.20);background:#fff;position:relative;z-index:1;}
.step.done .step-dot{background:var(--green);border-color:var(--green);}
.step.done::before{background:var(--green);}
.step-label{font-size:10px;color:var(--muted);}
.step.done .step-label{color:var(--green-dark);}
.btn-cancel{
  padding:7px 16px;border:1px solid rgba(220,50,50,0.25);
  border-radius:8px;background:transparent;color:rgba(220,50,50,0.70);
  font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;
}
.btn-cancel:hover{border-color:#e74c3c;color:#e74c3c;}
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-icon{font-size:56px;margin-bottom:16px;}
.btn-shop{
  display:inline-block;padding:12px 28px;
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;border-radius:12px;text-decoration:none;font-weight:600;margin-top:16px;
}
.toast{
  position:fixed;bottom:24px;right:24px;
  background:rgba(255,255,255,0.85);
  border:1px solid var(--green);color:var(--text);
  padding:14px 20px;border-radius:12px;font-size:14px;z-index:999;
  transform:translateY(80px);opacity:0;transition:all 0.3s;
  box-shadow:0 4px 20px rgba(29,185,84,0.15);backdrop-filter:blur(12px);
}
.toast.show{transform:translateY(0);opacity:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,31,15,0.50);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.modal{
  background:rgba(255,255,255,0.92);
  border:1px solid rgba(29,185,84,0.20);
  border-radius:20px;padding:32px;width:100%;max-width:420px;
  backdrop-filter:blur(24px);
  box-shadow:0 16px 48px rgba(29,185,84,0.15);
}
.modal-title{
  font-family:'Cinzel',serif;font-size:18px;
  background:linear-gradient(135deg,var(--green-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:20px;
}
.star-row{display:flex;gap:8px;margin-bottom:16px;}
.star{font-size:28px;cursor:pointer;transition:transform 0.1s;opacity:0.3;color:var(--gold);}
.star.active,.star:hover{opacity:1;transform:scale(1.1);}
textarea{
  width:100%;padding:12px;
  background:rgba(255,255,255,0.80);
  border:1px solid rgba(29,185,84,0.20);
  border-radius:12px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:14px;resize:vertical;min-height:90px;outline:none;
}
textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,185,84,0.10);}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn-sub{
  flex:1;padding:11px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.btn-cancel-modal{
  flex:1;padding:11px;border:1px solid rgba(29,185,84,0.20);
  border-radius:10px;background:transparent;color:var(--muted);
  cursor:pointer;font-family:'Inter',sans-serif;
}
</style>
</head>
<body>
<nav>
  <a href="customer-home.html" class="nav-logo">👑 REXMART</a>
  <div class="nav-links">
    <a href="customer-home.html" class="nav-btn">← Shop</a>
    <a href="customer-cart.html" class="nav-btn nav-btn-green">🛒 Cart</a>
    <button class="nav-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="page-title">📦 My Orders</div>
  <div id="orders-container"></div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="review-modal">
  <div class="modal">
    <div class="modal-title">⭐ Leave a Review</div>
    <div class="star-row" id="stars">
      <span class="star" onclick="setRating(1)">★</span>
      <span class="star" onclick="setRating(2)">★</span>
      <span class="star" onclick="setRating(3)">★</span>
      <span class="star" onclick="setRating(4)">★</span>
      <span class="star" onclick="setRating(5)">★</span>
    </div>
    <textarea id="review-comment" placeholder="Share your experience..."></textarea>
    <input type="hidden" id="review-product-id"/>
    <div class="modal-btns">
      <button class="btn-cancel-modal" onclick="closeReview()">Cancel</button>
      <button class="btn-sub" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8080/api';
// Global fetch interceptor to append JWT Bearer token
(function() {
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    const token = localStorage.getItem('jwtToken');
    if (token && !url.includes('/api/auth/login') && !url.includes('/api/auth/register')) {
      options.headers['Authorization'] = 'Bearer ' + token;
    }
    return originalFetch(url, options);
  };
})();
const customerId = localStorage.getItem('customerId');
let selectedRating = 0;
if (!customerId) { window.location.href = 'customer-login.html'; }

const statusOrder = ['PENDING', 'CONFIRMED', 'SHIPPED', 'DELIVERED'];

async function loadOrders() {
  try {
    const res = await fetch(`${API}/orders/customer/${customerId}`);
    if (!res.ok) throw new Error();
    const orders = await res.json();
    const container = document.getElementById('orders-container');
    if (!orders.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>No orders yet</p><a href="customer-home.html" class="btn-shop">Start Shopping</a></div>';
      return;
    }
    container.innerHTML = orders.reverse().map(o => {
      const stepIdx = statusOrder.indexOf(o.status);
      const isCancelled = o.status === 'CANCELLED';
      const timeline = isCancelled ? '' : `
        <div class="timeline">
          ${statusOrder.map((s, i) => `<div class="step ${i <= stepIdx ? 'done' : ''}"><div class="step-dot"></div><div class="step-label">${s}</div></div>`).join('')}
        </div>`;
      const products = o.products || [];
      return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${o.id}</div>
              <div class="order-date">${new Date(o.orderDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
            </div>
            <span class="status-badge status-${o.status}">${o.status}</span>
          </div>
          ${timeline}
          <div class="order-products">
            ${products.map(p => `<div class="product-chip">🛍️ ${p.name}</div>`).join('')}
          </div>
          <div class="order-footer">
            <div>
              <div class="order-total">₹${o.totalPrice.toFixed(2)}</div>
              <div class="order-qty">Qty: ${o.quantity}</div>
            </div>
            <div style="display:flex;gap:8px;">
              ${o.status === 'DELIVERED' && products.length ? `<button class="btn-cancel" style="border-color:rgba(201,168,76,0.3);color:var(--gold);" onclick="openReview(${products[0].id})">⭐ Review</button>` : ''}
              ${o.status === 'PENDING' ? `<button class="btn-cancel" onclick="cancelOrder(${o.id})">Cancel Order</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('orders-container').innerHTML =
      '<div class="empty"><div class="empty-icon">❌</div><p>Failed to load orders</p></div>';
  }
}

async function cancelOrder(id) {
  if (!confirm('Cancel this order?')) return;
  try {
    await fetch(`${API}/orders/${id}/cancel`, { method: 'PUT' });
    showToast('Order cancelled'); loadOrders();
  } catch { showToast('❌ Failed'); }
}

function openReview(productId) {
  document.getElementById('review-product-id').value = productId;
  document.getElementById('review-comment').value = '';
  setRating(0);
  document.getElementById('review-modal').classList.add('show');
}

function closeReview() { document.getElementById('review-modal').classList.remove('show'); }

function setRating(r) {
  selectedRating = r;
  document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < r));
}

async function submitReview() {
  const productId = parseInt(document.getElementById('review-product-id').value);
  const comment = document.getElementById('review-comment').value.trim();
  if (!selectedRating) { showToast('Please select a rating'); return; }
  try {
    await fetch(`${API}/reviews`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating: selectedRating, comment, customerId: parseInt(customerId), productId })
    });
    closeReview(); showToast('⭐ Review submitted!');
  } catch { showToast('❌ Failed to submit'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function logout() { localStorage.clear(); window.location.href = 'customer-login.html'; }

loadOrders();
</script>
</body>
</html>
